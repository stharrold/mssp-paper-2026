[project]
name = "mssp-paper-2026"
version = "1.1.0"
description = "Manuscript build for the preregistered MSSP early-renewal study (medRxiv preprint; i-JMR submission)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib==3.11.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.uv]
package = false

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

# Pandoc metadata for the manuscript (paper.md) and the supplement (supplement.md); see scripts/build.sh.
title: "Early Renewal of Accountable Care Organization Agreements to Reset Benchmarks in the Medicare Shared Savings Program: Preregistered Retrospective Cohort Study"
author: "Samuel Thomas Harrold"
date: "October 2026"
lang: en-US

# Latin Modern by file name (tectonic does not look fonts up by family name). Eisvogel's default, Source Sans Pro,
# maps the hyphen to U+2011 in the PDF's text layer, so DOIs and URLs copied from the PDF would not resolve. Latin
# Modern has no Greek text glyphs: write Greek letters as math.
mainfont: lmroman10-regular.otf
mainfontoptions:
  - BoldFont=lmroman10-bold.otf
  - ItalicFont=lmroman10-italic.otf
  - BoldItalicFont=lmroman10-bolditalic.otf
sansfont: lmsans10-regular.otf
sansfontoptions:
  - BoldFont=lmsans10-bold.otf
  - ItalicFont=lmsans10-oblique.otf
  - BoldItalicFont=lmsans10-boldoblique.otf
monofont: lmmono10-regular.otf

documentclass: article
papersize: letter
geometry:
  - margin=1in
fontsize: 11pt
linestretch: 1.3
toc: false
numbersections: false

csl: citation-style-ama.csl
link-citations: true
link-bibliography: true

colorlinks: true
linkcolor: "blue"
urlcolor: "blue"
citecolor: "blue"

# Eisvogel 3.3.0 (scripts/build.sh installs it, checksum-pinned)
titlepage: false
# Eisvogel prints the title only on a title page; this puts it at the top of page 1 instead.
include-before:
  - '`\maketitle`{=latex}'
header-left: "Early renewal in the Medicare Shared Savings Program"
header-right: "October 2026"
footer-left: "CC BY 4.0"
footer-center: "\\thepage"
footer-right: "\\hspace{0pt}"
table-use-row-colors: false
prevent-widows: true

header-includes:
  - \usepackage{xurl}
  - \usepackage{booktabs}
  - \setcounter{secnumdepth}{-\maxdimen}
  # Captions carry literal "Table N."/"Figure N." prefixes (pandoc's DOCX writer emits no numbering), so suppress
  # LaTeX's own label to avoid "Table 1: Table 1. ...".
  - \usepackage[labelformat=empty,font=small]{caption}
  - \usepackage{etoolbox}
  - \AtBeginEnvironment{longtable}{\footnotesize}
  - \usepackage{float}
  - \floatplacement{figure}{H}
